services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      YH_DB: /data/yahakim.db
      # Cookies are marked Secure automatically when APP_URL (in .env) is https://.
    volumes:
      - yahakim-data:/data
    restart: unless-stopped

volumes:
  yahakim-data:
